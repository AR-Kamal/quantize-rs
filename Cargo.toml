[package]
name = "quantize-rs"
version = "0.9.0"
edition = "2021"
# Minimum supported Rust version. Our own code needs 1.87 (`<int>::is_multiple_of`);
# the binding floor is 1.88, required by `time` — a build-dependency pulled in
# transitively via the default `calibration` feature (tract-linalg → liquid → time).
# Validated by clippy's `incompatible_msrv` lint under `-D warnings`.
rust-version = "1.88"
authors = ["Abdul Rahman Kamal <abdulrahmandev141@gmail.com>"]
description = "Neural network quantization toolkit for ONNX models"
license = "MIT"
repository = "https://github.com/AR-Kamal/quantize-rs"
homepage = "https://github.com/AR-Kamal/quantize-rs"
documentation = "https://docs.rs/quantize-rs"
readme = "README.md"
keywords = ["quantization", "neural-network", "onnx", "ml", "optimization"]
categories = ["command-line-utilities", "science", "compression"]
exclude = ["*.onnx", "examples/*.onnx", "quantize_rs.pyi", "py.typed"]


[dependencies]
glob = "0.3"
rand = "0.8"
rayon = "1.8"

# Logging facade — library warnings go through `log` so consumers can route or
# suppress them (the CLI installs a stderr logger; Python uses pyo3-log).
log = "0.4"

# ONNX model parsing — prost-generated from proto/onnx.proto3
prost = "0.13"

# CLI interface
clap = { version = "4.4", features = ["derive"] }

# Python bindings.  `abi3-py39` builds a single wheel compatible with Python
# 3.9 and every newer release (3.10/3.11/3.12/3.13/…), so CI doesn't need a
# matrix over interpreter versions.
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"], optional = true }
# Bridges Rust `log` records into Python's `logging` for the Python bindings.
pyo3-log = { version = "0.12", optional = true }

# Error handling
anyhow = "1.0"

colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
toml = "0.8"

# Calibration — optional heavy deps (tract inference engine, ndarray for .npy)
tract-onnx = { version = "0.21", optional = true }
tract-core = { version = "0.21", optional = true }
ndarray = { version = "0.15", optional = true }
ndarray-npy = { version = "0.8", optional = true }

# Memory-mapped model loading for multi-GB ONNX files (optional).
memmap2 = { version = "0.9", optional = true }

# HuggingFace .safetensors calibration input (optional).
safetensors = { version = "0.4", optional = true }

[features]
default = ["calibration"]
calibration = ["tract-onnx", "tract-core", "ndarray", "ndarray-npy"]
python = ["pyo3", "pyo3-log"]
mmap = ["memmap2"]
safetensors-input = ["safetensors"]

[build-dependencies]
prost-build = "0.13"
protox = "0.7"

[dev-dependencies]
approx = "0.5"
criterion = "0.5"
tempfile = "3"
proptest = "1"

# Maturin looks for this section when building Python wheels
[package.metadata.maturin]
python-source = "python"
module-name = "quantize_rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "quantize-rs"
path = "src/main.rs"

[lib]
name = "quantize_rs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[example]]
name = "basic_quantization"
path = "examples/basic_quantization.rs"

[[example]]
name = "batch_quantize"
path = "examples/batch_quantize.rs"

[[example]]
name = "activation_calibration"
path = "examples/activation_calibration.rs"
required-features = ["calibration"]

[[example]]
name = "validate_real_model"
path = "examples/validate_real_model.rs"

[[bench]]
name = "quantization"
harness = false