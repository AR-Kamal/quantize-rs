name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # ── 0. Gate: version/tag consistency + full quality bar + crate packaging ──
  # Every publish job depends (directly or transitively) on this, so a tagged
  # release cannot reach crates.io OR PyPI without first passing the tag↔version
  # check, tests, lints, docs, and a crate-packaging dry-run. This is what makes
  # the pipeline all-or-nothing for everything detectable before upload.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Candidate versions agree (and match the tag on publication)
        run: |
          cargo_ver=$(grep -m1 '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          py_ver=$(grep -m1 '^version[[:space:]]*=' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag="$cargo_ver"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            tag="${GITHUB_REF_NAME#v}"
          fi
          echo "candidate=$tag  Cargo.toml=$cargo_ver  pyproject.toml=$py_ver"
          if [ -z "$tag" ] || [ -z "$cargo_ver" ] || [ -z "$py_ver" ]; then
            echo "::error::could not parse a version (tag='$tag' cargo='$cargo_ver' pyproject='$py_ver')"
            exit 1
          fi
          if [ "$tag" != "$cargo_ver" ]; then
            echo "::error::git tag v$tag does not match Cargo.toml version $cargo_ver"
            exit 1
          fi
          if [ "$tag" != "$py_ver" ]; then
            echo "::error::git tag v$tag does not match pyproject.toml version $py_ver"
            exit 1
          fi
          echo "OK: tag and both manifests agree on version $tag"
      - name: Tests (default features)
        run: cargo test --locked --all
      - name: Tests (without calibration)
        run: cargo test --locked --no-default-features --lib
      - name: Tests (safetensors without calibration)
        run: cargo test --locked --no-default-features --features safetensors-input --lib
      - name: Examples and benchmark compilation
        run: |
          cargo check --locked --examples
          cargo check --locked --no-default-features --examples
          cargo bench --locked --all-features --no-run
      - name: Tests (all features)
        run: cargo test --locked --all-features --all
      - name: Clippy (all features, all targets)
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Build docs (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime verification dependencies
        run: python -m pip install numpy onnx onnxruntime maturin psutil
      - name: Build and install CLI and Python wheel for runtime checks
        run: |
          cargo build --locked --bin quantize-rs
          maturin build --locked --features python
          python -m pip install --force-reinstall --no-deps target/wheels/*.whl
      - name: ONNX Runtime weight execution
        run: python eval/ort_smoke_test.py --binary ./target/debug/quantize-rs
      - name: Evaluation regression tests
        run: python -m unittest discover -s eval -p 'test_*.py' -v
      - name: Operator selection, quantization axes and Python API checks
        run: python eval/operator_axes_smoke_test.py --binary ./target/debug/quantize-rs --python
      - name: Static Conv calibration and Python API checks
        run: python eval/calibration_smoke_test.py --binary ./target/debug/quantize-rs --python --artifacts target/calibration-smoke
      - name: Matrix activation accuracy and integer-kernel execution
        run: python eval/matrix_calibration_smoke_test.py --binary ./target/debug/quantize-rs --report target/matrix-activation-smoke.json
      - name: Labeled MNIST calibration accuracy gate
        run: python eval/cnn_evaluation.py --mnist --download --binary ./target/debug/quantize-rs
      - name: Upload runtime verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-runtime-diagnostics
          path: |
            target/calibration-smoke/
            target/matrix-activation-smoke.json
            target/cnn-evaluation/report.json
          if-no-files-found: ignore
      # Package + build the crate exactly as crates.io would, so packaging
      # problems (excluded-but-referenced files, etc.) fail here — before any
      # real publish — rather than after PyPI has already gone out.
      - name: Crate packaging dry-run
        run: cargo publish --locked --dry-run

  # ── 1. Build Python wheels on all platforms (only after verify) ──
  build-wheels:
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: manylinux2014
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # `pyo3/abi3-py39` is enabled in Cargo.toml so this builds a single
          # ABI3 wheel compatible with Python 3.9 and every newer release.
          args: --locked --release --features python
          manylinux: ${{ matrix.manylinux || 'auto' }}
      - name: Inspect wheel contents and metadata
        shell: bash
        run: python scripts/check_release_artifacts.py target/wheels/*.whl
      - name: Install and import native wheel
        # macOS x86_64 is cross-built on the arm64 runner; validate its build
        # here, and require an Intel installation check before publication.
        if: matrix.target != 'x86_64-apple-darwin' || runner.arch == 'X64'
        shell: bash
        run: |
          python -m pip install --no-deps target/wheels/*.whl
          python -c "import importlib.metadata as m, quantize_rs; assert quantize_rs.__version__ == m.version('quantization-rs')"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: target/wheels/*.whl

  # ── 2. Build source distribution (only after verify) ──
  build-sdist:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Inspect sdist and rebuild an installable wheel
        run: |
          python scripts/check_release_artifacts.py target/wheels/*.tar.gz
          python -m pip install maturin
          python -m pip wheel --no-build-isolation --no-deps --config-settings build-args=--locked --wheel-dir target/rebuilt target/wheels/*.tar.gz
          python scripts/check_release_artifacts.py target/rebuilt/*.whl
          python -m pip install --no-deps target/rebuilt/*.whl
          python -c "import importlib.metadata as m, quantize_rs; assert quantize_rs.__version__ == m.version('quantization-rs')"
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  # ── 3. Publish Rust crate to crates.io ──
  # Gated on the full artifact set: the crate is not published unless every wheel
  # and the sdist built, so a wheel-build failure can't leave a crates.io-only
  # release. This is the first (and irreversible) publish — it acts as the commit
  # point that PyPI then follows.
  publish-crate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── 4. Publish all wheels + sdist to PyPI ──
  # Runs only after the crate is published, so a crates.io failure can't leave a
  # PyPI-only release. If THIS step fails, crates.io is published but PyPI isn't —
  # the one remaining split, and a recoverable one: re-run this job (the crate is
  # already out, so it is skipped).
  publish-pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheels, build-sdist, publish-crate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/

  # ── 5. Create GitHub release (only if BOTH registries published) ──
  # No `always()`: this runs only when publish-crate AND publish-pypi both
  # succeeded, so a GitHub release is never created for a half-published version.
  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs: [publish-crate, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - name: Create release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md) for full details." \
            dist/*
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# For Devs Only
