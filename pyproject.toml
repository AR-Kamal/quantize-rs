[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
 
 
[project]
name = "quantization-rs"
version = "0.9.0"
description = "Neural network quantization toolkit for ONNX models"
readme = "README_PYTHON.md"
# Matches the abi3-py39 wheel tag (Cargo's pyo3 `abi3-py39`); a 3.8 interpreter
# can't load the cp39-abi3 wheel anyway.
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
keywords = ["quantization", "onnx", "neural-networks", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "onnxruntime>=1.16.0",
    "onnx>=1.14.0",
]

[project.urls]
Homepage = "https://github.com/AR-Kamal/quantize-rs"
Repository = "https://github.com/AR-Kamal/quantize-rs"
Documentation = "https://github.com/AR-Kamal/quantize-rs#readme"

[tool.maturin]
features = ["python"]
module-name = "quantize_rs"
# Ship PEP 561 type information for the native module so editors / mypy / pyright
# can type-check `import quantize_rs`.  Placed at the wheel root, next to the
# compiled extension.
include = [
    { path = "quantize_rs.pyi", format = "wheel" },
    { path = "py.typed", format = "wheel" },
]